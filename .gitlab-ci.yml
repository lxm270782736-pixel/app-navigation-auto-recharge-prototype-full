# App CI/CD — 从 manifest.yaml 自动安装依赖并运行测试
# 基础镜像 ASTRIBOT_BASE_IMAGE 已预装: Python 3.10, pytest, pyyaml, 内部 PyPI 认证
# 触发：MR 目标为 main / 直接推送 main

stages:
  - test
  - package

variables:
  COVERAGE_MIN: "80"
  COVERAGE_ENFORCE: "false"
  # [临时方案] CI Job Token 403 问题修复前，跳过 Runner 内置 clone，改用 Deploy Token 手动克隆
  # 升级路径：获取管理员权限 → 修复 CI Job Token → 删除此行恢复默认 clone
  GIT_STRATEGY: none

# ---- 公共：手动克隆（GIT_STRATEGY: none workaround） ----
# [临时方案] 使用 Runner 注入的 Deploy Token 克隆项目代码
# 升级路径：GIT_STRATEGY 恢复默认后，删除此 anchor 及所有 *clone 引用

.clone: &clone
  - rm -rf ./* .git
  - git clone --depth=20 --branch=${CI_COMMIT_REF_NAME}
      https://${CI_DEPLOY_USER}:${CI_DEPLOY_PASSWORD}@gitlab.astribot.com/${CI_PROJECT_PATH}.git .
  - git checkout ${CI_COMMIT_SHA}

# ---- 公共：升级 pip/packaging（基础镜像 packaging==21.3 过旧） ----

.setup_pip: &setup_pip
  - pip config set global.index-url https://pypi.tuna.tsinghua.edu.cn/simple
  - pip config set global.timeout 120
  - pip install --quiet --upgrade pip packaging pytest pytest-cov anyio

# ---- test：运行 pytest ----

test:
  stage: test
  image: ${ASTRIBOT_BASE_IMAGE}
  tags:
    - build
  before_script:
    - *clone
    - *setup_pip
    - pip install --quiet -r requirements.txt
    - |
      python3 -c "
      import yaml, subprocess, sys
      m = yaml.safe_load(open('manifest.yaml'))
      deps = m.get('dependencies', {}).get('pip', [])
      if deps:
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--quiet'] + deps)
      "
  script:
    - |
      COV_ARGS="--cov=. --cov-report=term-missing"
      if [ "${COVERAGE_ENFORCE}" = "true" ]; then
        COV_ARGS="${COV_ARGS} --cov-fail-under=${COVERAGE_MIN}"
      fi
      if [ -d tests ]; then
        python3 -m pytest tests/ -v $COV_ARGS
      else
        echo "⚠️ tests/ 目录不存在，跳过测试（请尽快补充单元测试）"
      fi
  coverage: '/TOTAL.*\s+(\d+%)/'
  rules:
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"
    - if: $CI_COMMIT_BRANCH == "main"

# ---- package：打 tag 后构建 .deb 并发布到 APT repo (reprepro) ----

package_deb:
  stage: package
  image: ${ASTRIBOT_ARM_BASE_IMAGE}
  tags:
    - build-arm
  before_script:
    - *clone
  script:
    - /opt/deb_builder/build_deb.sh --build-number ${CI_PIPELINE_IID} --publish
  artifacts:
    paths:
      - dist/*.deb
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_TAG

# --- agent-scan：merge 到 main 后自动更新 AGENT.md ---

agent-scan:
  stage: .post
  image: ${ASTRIBOT_BASE_IMAGE}
  tags:
    - build
  before_script:
    - *clone
  script:
    - |
      git config user.email "ci-bot@astribot.com"
      git config user.name "CI Bot"
      AGENT_MD_URL="https://git-agent:${GIT_AGENT_PASSWORD}@${AGENT_MD_REPO_URL}.git"
      git clone --depth=1 "${AGENT_MD_URL}" /tmp/agent_md 2>/dev/null || true
      if [ -f /tmp/agent_md/tools/agent_scan.py ]; then
        python3 /tmp/agent_md/tools/agent_scan.py --repo-root . --output AGENT.md
        git add AGENT.md
        git commit -m "docs: auto-update AGENT.md via CI agent-scan"
        git push origin HEAD:main
      fi
    - |
      if [ -f AGENT.md ] && grep -q '\[Blocker\]' AGENT.md; then
        BLOCKER_LINES=$(grep '\[Blocker\]' AGENT.md | head -5)
        curl -s -X POST "${FEISHU_WEBHOOK_URL}" \
          -H "Content-Type: application/json" \
          -d "{
            \"msg_type\": \"interactive\",
            \"card\": {
              \"header\": {\"title\": {\"tag\": \"plain_text\", \"content\": \"⚠️ Blocker — ${CI_PROJECT_NAME}\"}, \"template\": \"red\"},
              \"elements\": [{\"tag\": \"div\", \"text\": {\"tag\": \"lark_md\", \"content\": \"**仓库**: [${CI_PROJECT_PATH}](${CI_PROJECT_URL})\\n${BLOCKER_LINES}\"}},
                {\"tag\": \"action\", \"actions\": [{\"tag\": \"button\", \"text\": {\"tag\": \"plain_text\", \"content\": \"查看 AGENT.md\"}, \"url\": \"${CI_PROJECT_URL}/-/blob/main/AGENT.md\", \"type\": \"primary\"}]}]
            }
          }"
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success
  allow_failure: true
