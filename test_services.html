<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROS 服务测试工具</title>
    <style>
        body {
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #1e1e1e;
            color: #d4d4d4;
        }
        h1 {
            color: #4ec9b0;
            border-bottom: 2px solid #4ec9b0;
            padding-bottom: 10px;
        }
        .section {
            margin: 20px 0;
            padding: 15px;
            background: #2d2d2d;
            border-radius: 5px;
            border-left: 3px solid #007acc;
        }
        .section h2 {
            color: #569cd6;
            margin-top: 0;
        }
        button {
            background: #0e639c;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover {
            background: #1177bb;
        }
        button:disabled {
            background: #505050;
            cursor: not-allowed;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 3px;
        }
        .status.success {
            background: #1e3a1e;
            border-left: 3px solid #4ec9b0;
        }
        .status.error {
            background: #3a1e1e;
            border-left: 3px solid #f48771;
        }
        .status.info {
            background: #1e2a3a;
            border-left: 3px solid #569cd6;
        }
        pre {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 3px;
            overflow-x: auto;
            border: 1px solid #3e3e3e;
        }
        code {
            color: #ce9178;
        }
        input {
            background: #3c3c3c;
            border: 1px solid #555;
            color: #d4d4d4;
            padding: 8px;
            border-radius: 3px;
            font-family: inherit;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 10px;
        }
    </style>
</head>
<body>
    <h1>🤖 ROS 服务测试工具</h1>

    <div class="section">
        <h2>连接状态</h2>
        <div id="connectionStatus" class="status info">未连接</div>
        <button onclick="connect()">连接 ROS</button>
        <button onclick="disconnect()">断开连接</button>
    </div>

    <div class="section">
        <h2>定位模式控制</h2>
        <div class="grid">
            <button onclick="callService('/localization/start_mapping')">启动建图</button>
            <button onclick="callService('/localization/start_localization')">启动定位(手动)</button>
            <button onclick="callService('/localization/start_localization_auto')">启动定位(自动)</button>
            <button onclick="callService('/localization/start_obstacle_avoidance')">启动避障</button>
            <button onclick="callService('/localization/stop')">停止</button>
            <button onclick="callService('/localization/shutdown')">关闭服务</button>
        </div>
    </div>

    <div class="section">
        <h2>地图管理</h2>
        <button onclick="listMaps()">列出地图</button>
        <button onclick="loadMap()">加载地图</button>
        <button onclick="deleteMap()">删除地图</button>
        <button onclick="applyMap()">应用地图</button>
        <div id="mapList" style="margin-top: 10px;"></div>
    </div>

    <div class="section">
        <h2>遥控器控制</h2>
        <button onclick="callService('/joystick/start')">启动遥控器</button>
        <button onclick="callService('/joystick/stop')">停止遥控器</button>
    </div>

    <div class="section">
        <h2>响应日志</h2>
        <button onclick="clearLog()">清空日志</button>
        <pre id="log"></pre>
    </div>

    <script src="http://static.robotwebtools.org/roslibjs/current/roslib.min.js"></script>
    <script>
        let ros = null;
        let connected = false;

        function log(message, type = 'info') {
            const logElement = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            const color = type === 'success' ? '#4ec9b0' : type === 'error' ? '#f48771' : '#569cd6';
            logElement.innerHTML += `<span style="color: ${color}">[${timestamp}] ${message}</span>\n`;
            logElement.scrollTop = logElement.scrollHeight;
        }

        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }

        function updateStatus(message, type) {
            const statusElement = document.getElementById('connectionStatus');
            statusElement.textContent = message;
            statusElement.className = `status ${type}`;
        }

        function connect() {
            if (connected) {
                log('已经连接到 ROS', 'info');
                return;
            }

            ros = new ROSLIB.Ros({
                url: 'ws://localhost:9090'
            });

            ros.on('connection', () => {
                connected = true;
                updateStatus('✓ 已连接到 ROS (ws://localhost:9090)', 'success');
                log('成功连接到 ROS Bridge', 'success');
            });

            ros.on('error', (error) => {
                updateStatus('✗ 连接错误', 'error');
                log('连接错误: ' + error, 'error');
            });

            ros.on('close', () => {
                connected = false;
                updateStatus('连接已关闭', 'info');
                log('ROS 连接已关闭', 'info');
            });
        }

        async function callService(serviceName, args = {}, serviceType = 'std_srvs/Trigger') {
            if (!connected) {
                log('请先连接 后端', 'error');
                return;
            }

            log(`调用服务: ${serviceName} (${serviceType})`, 'info');
            log(`请求参数: ${JSON.stringify(args, null, 2)}`, 'info');

            const service = new ROSLIB.Service({
                ros: ros,
                name: serviceName,
                serviceType: serviceType
            });

            const request = new ROSLIB.ServiceRequest(args);

            service.callService(request, (response) => {
                log(`服务响应成功:`, 'success');
                log(JSON.stringify(response, null, 2), 'success');

                if (response.success !== undefined) {
                    if (response.success) {
                        updateStatus(`✓ ${response.message || '操作成功'}`, 'success');
                    } else {
                        updateStatus(`✗ ${response.message || '操作失败'}`, 'error');
                    }
                }
            }, (error) => {
                log(`服务调用失败: ${error}`, 'error');
                updateStatus(`✗ 服务调用失败`, 'error');
            });
        }

        async function listMaps() {
            if (!connected) {
                log('请先连接 后端', 'error');
                return;
            }

            log('调用服务: /map_manager/list_maps (localization_msgs/ListMaps)', 'info');

            const service = new ROSLIB.Service({
                ros: ros,
                name: '/map_manager/list_maps',
                serviceType: 'localization_msgs/ListMaps'
            });

            service.callService(new ROSLIB.ServiceRequest({}), (response) => {
                log('地图列表响应:', 'success');
                log(JSON.stringify(response, null, 2), 'success');

                const mapListElement = document.getElementById('mapList');

                if (response.success && response.maps && response.maps.length > 0) {
                    let html = '<div style="margin-top: 10px;"><strong>找到 ' + response.maps.length + ' 个地图:</strong><ul>';
                    response.maps.forEach((map, index) => {
                        html += `<li>${index + 1}. ${map.name} (${map.width}x${map.height}, ${map.resolution.toFixed(3)}m/px)</li>`;
                    });
                    html += '</ul></div>';
                    mapListElement.innerHTML = html;
                } else {
                    mapListElement.innerHTML = '<div style="color: #808080; margin-top: 10px;">暂无地图</div>';
                }
            }, (error) => {
                log(`获取地图列表失败: ${error}`, 'error');
            });
        }

        function loadMap() {
            const mapName = prompt('输入要加载的地图名称:');
            if (mapName) {
                callService('/map_manager/load_map', { map_name: mapName }, 'localization_msgs/LoadMap');
            }
        }

        function deleteMap() {
            const mapName = prompt('输入要删除的地图名称:');
            if (mapName) {
                if (confirm(`确定要删除地图 "${mapName}" 吗？`)) {
                    callService('/map_manager/delete_map', { map_name: mapName }, 'localization_msgs/DeleteMap');
                }
            }
        }

        function applyMap() {
            const mapName = prompt('输入要应用的地图名称:');
            if (mapName) {
                callService('/map_manager/apply_map', { map_name: mapName }, 'localization_msgs/SetMapName');
            }
        }

        // 页面加载时自动连接
        window.addEventListener('load', () => {
            log('页面已加载，点击"连接 ROS"按钮开始', 'info');
        });
    </script>
</body>
</html>
