id: "com.astribot.app.navigation"
name: "导航"
version: "1.1.21"
description: "机器人SLAM建图和自主导航应用"

dependencies:
  python: ">= 3.10"
  pip:
    - "astribot_link"
    - "fastapi"
    - "sse-starlette"
    - "uvicorn"
    - "pyyaml"

requiredMetas:
  - localization
  - astribot_navigation

# Meta 服务通过 UDS 自动发现（/dev/shm/astribot_bus/）
# 无需配置 remote_routes

# --- Stardust Desktop Integration ---
port: 17659
entrypoint: python3 -m src.main
uiType: tsx

modes:
  standalone:
    description: "独立访问模式，直接通过 http://host:port 访问"
    entry: "python3 -m src.main"
  embedded:
    description: "星尘桌面嵌入模式，通过反向代理 + iframe 加载"
    entry: "python3 -m src.main"
    rootPath: "/apps/navigation"
    buildCommand: "cd ui && npm run build:lib"
