id: "com.astribot.app.navigation"
name: "Navigation"
version: "1.0.0"
description: "机器人SLAM建图和自主导航应用"

dependencies:
  python: ">= 3.10"
  pip:
    - "astribot_link"
    - "fastapi"
    - "sse-starlette"
    - "uvicorn"
    - "pyyaml"

requiredMetas:
  - localization
  - astribot_navigation

# Meta 服务通过 UDS 自动发现（/dev/shm/astribot_bus/）
# 无需配置 remote_routes
